rack your transfers\",\"TRUSTPILOT_SUBTITLE\":\"What people are saying\",\"TRUSTPILOT_TITLE\":\"{{TOTAL_REVIEWS}} customers recommend Xe\",\"WAYS_ITEM_FIVE_DESC\":\"Send to your loved one\u2019s mobile wallet using trusted providers. Your money will be deposited in minutes.\",\"WAYS_ITEM_FIVE_TITLE\":\"Mobile Wallet\",\"WAYS_ITEM_FOUR_DESC\":\"Transfer directly to your recipients bank account, this typically takes up to 3 days and has no additional fees.\",\"WAYS_ITEM_FOUR_TITLE\":\"Bank Account\",\"WAYS_ITEM_ONE_DESC\":\"Direct Debit, or Automated Clearing House (ACH) payments take funds directly from your bank account.\",\"WAYS_ITEM_ONE_TITLE\":\"Direct Debit ACH\",\"WAYS_ITEM_SIX_DESC\":\"Your recipient can receive their cash in person, at over 500,000 Xe cash pickup locations worldwide.\",\"WAYS_ITEM_SIX_TITLE\":\"Cash Pickup\",\"WAYS_ITEM_THREE_DESC\":\"Card payments typically take less than 24 hours. However, card payments come with a small additional fee.\",\"WAYS_ITEM_THREE_TITLE\":\"Debit or Credit Card\",\"WAYS_ITEM_TWO_DESC\":\"Wire transfers will move money by transferring from your bank to ours. We usually receive money in 24 hours.\",\"WAYS_ITEM_TWO_TITLE\":\"Wire Transfer\",\"WAYS_TAB_ONE_TITLE\":\"Ways to send\",\"WAYS_TAB_TWO_TITLE\":\"Ways to receive\",\"WAYS_TITLE\":\"Send money to over 200 countries in 100+ currencies\"}},\"converter\":{\"en\":{\"smartling\":{\"placeholder_format_custom\":[\"\\u003c\\\\/?[0-9]\\\\/?\\u003e\",\"\\\\{\\\\{[a-zA-Z]+\\\\}\\\\}\"]},\"amountLabel\":\"Amount\",\"fromLabel\":\"From\",\"toLabel\":\"To\",\"validAmountError\":\"Please enter a valid amount\",\"negativeAmountError\":\"Please enter an amount greater than 0\",\"conversionFrom\":\"{{amount}} {{currencyName}} =\",\"conversionTo\":\"\\u003c0/\\u003e {{currencyName}}\",\"unitRateText\":\"{{fromAmount}} {{fromCurrencyCode}} = {{toAmount}} {{toCurrencyCode}}\",\"midmarketTooltipPrompt\":\"We use midmarket rates\",\"tooltip\":\"The send rate represents the rate of exc